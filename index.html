    const formatCurrencyWithRegion = (val, region = 'IN') => {
      if (region === 'US') {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumFractionDigits: 0
        }).format(val || 0);
      }
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(val || 0);
    };

    const cleanNumber = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const cleaned = val.toString().replace(/[^0-9.-]+/g, '');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    };

    const parseCSVText = (text) => {
      const lines = text.trim().split(/\r\n|\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return { success: false, message: 'CSV requires a header row and at least one data row.' };

      // Split header while honoring quotes
      const splitRow = (row) => {
        const matches = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
          const char = row[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            matches.push(cur.trim().replace(/^["']|["']$/g, ''));
            cur = '';
          } else {
            cur += char;
          }
        }
        matches.push(cur.trim().replace(/^["']|["']$/g, ''));
        return matches;
      };

      const headers = splitRow(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
      const parsedInvoices = [];
      const parsedExpenses = [];
      let detectedCash = null;

      for (let i = 1; i < lines.length; i++) {
        const rawCells = splitRow(lines[i]);
        if (rawCells.length < 2 || !rawCells.some(Boolean)) continue;

        const row = {};
        headers.forEach((h, idx) => {
          row[h] = rawCells[idx] !== undefined ? rawCells[idx] : '';
        });

        // Determine title
        const title = row.title || row.name || row.description || row.desc || row.client || row.particulars || row.vendor || `Item #${i}`;

        // Detect day or date
        let day = 15;
        const rawDate = row.day || row.duedate || row.date || row.transactiondate || '';
        if (rawDate) {
          const numDay = parseInt(rawDate, 10);
          if (!isNaN(numDay) && numDay >= 1 && numDay <= 90 && !rawDate.includes('/') && !rawDate.includes('-')) {
            day = numDay;
          } else {
            // Attempt to parse calendar date (e.g. 2026-10-15 or 15/10/2026)
            const parsed = new Date(rawDate);
            if (!isNaN(parsed.getTime())) {
              const diffDays = Math.ceil((parsed - new Date()) / (1000 * 60 * 60 * 24));
              day = Math.min(Math.max(1, diffDays > 0 ? diffDays : Math.abs(diffDays % 90) + 1), 90);
            }
          }
        }

        // Detect Opening Cash
        const lowerTitle = title.toLowerCase();
        const rawType = (row.type || row.category || '').toLowerCase();
        if (rawType.includes('balance') || lowerTitle.includes('opening cash') || lowerTitle.includes('starting cash') || lowerTitle.includes('initial cash')) {
          detectedCash = cleanNumber(row.amount || row.balance || row.value || 0);
          continue;
        }

        // Amount detection with bank debit/credit columns
        const creditAmt = cleanNumber(row.credit || row.deposit || row.inflow || 0);
        const debitAmt = cleanNumber(row.debit || row.withdrawal || row.outflow || 0);
        const genericAmt = cleanNumber(row.amount || row.value || row.total || 0);

        let isIncome = false;
        let finalAmount = 0;

        if (creditAmt > 0) {
          isIncome = true;
          finalAmount = creditAmt;
        } else if (debitAmt > 0) {
          isIncome = false;
          finalAmount = debitAmt;
        } else {
          finalAmount = Math.abs(genericAmt);
          if (genericAmt > 0) {
            isIncome = rawType.includes('income') || rawType.includes('invoice') || rawType.includes('receivable') || rawType.includes('revenue') || rawType.includes('sale') || lowerTitle.includes('client');
          } else if (genericAmt < 0) {
            isIncome = false;
          } else {
            isIncome = rawType.includes('income') || rawType.includes('invoice') || rawType.includes('receivable');
          }
        }

        if (finalAmount <= 0) continue;

        if (isIncome) {
          parsedInvoices.push({
            id: `csv-inv-${Date.now()}-${i}`,
            client: title,
            amount: finalAmount,
            dueDate: day,
            confidence: (row.confidence || 'high').toLowerCase(),
            status: 'pending',
            delayDays: 0,
            contactName: title.split(' ')[0] || 'Client',
            email: row.email || 'billing@partner.com'
          });
        } else {
          parsedExpenses.push({
            id: `csv-exp-${Date.now()}-${i}`,
            title: title,
            amount: finalAmount,
            dueDayOfInterval: [day],
            category: row.category || (lowerTitle.includes('salary') || lowerTitle.includes('payroll') ? 'Payroll' : lowerTitle.includes('tax') || lowerTitle.includes('gst') ? 'Tax' : lowerTitle.includes('rent') ? 'Rent' : 'Vendor'),
            essential: !['marketing', 'discretionary', 'capex', 'office perks', 'party'].some(k => (row.category || '').toLowerCase().includes(k) || lowerTitle.includes(k)),
            delayedDays: 0
          });
        }
      }

      return {
        success: true,
        detectedCash,
        invoices: parsedInvoices,
        expenses: parsedExpenses,
        totalRows: parsedInvoices.length + parsedExpenses.length
      };
    };

  "category": "Vendor" | "Tax" | "Rent" | "Payroll" | "CapEx" | "Discretionary",
  "essential": true or false
}`;

            const payload = {
              contents: [

                  role: "user",
                  parts: [
                    { text: promptText },
                    {
                      inlineData: {
                        mimeType: mimeType,
                        data: base64Data
                      }
                    }
                  ]
                }
              ],
              generationConfig: {
                responseMimeType: "application/json"
              }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            // Retry with exponential backoff
            const fetchWithRetry = async (retries = 2, delay = 1000) => {
              for (let i = 0; i <= retries; i++) {
                try {
                  const resp = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                  });
                  if (resp.ok) return await resp.json();
                } catch (e) {
                  if (i === retries) throw e;
                }
                await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
              }
            };

            const result = await fetchWithRetry();

            outflow: dayOutflow,

            const effectiveDueDays = dueList.map(d => d + (exp.delayedDays || 0));

          if (day > 0) {
            simBalance = simBalance + simDayInflow - simDayOutflow;

          if (simBalance < minSim) minSim = simBalance;

            simCash: Math.round(simBalance),

          `Restructured ${activeNegotiationExpense.title}. Saved ${formatCurrency(negotiationCalculations.cashSavedDuringCrunch)} in the crunch window.`
        );
      };

      const handleApplyActionExecution = (actionKey, mutationFn, successMessage) => {
        pushHistorySnapshot(`Applied Action: ${actionKey}`);
        mutationFn();
        setAppliedActions(prev => ({ ...prev, [actionKey]: true }));
        showToast('Action Applied to Forecast', successMessage);
      };

      const toggleInvoiceStatus = (id) => {
        pushHistorySnapshot('Toggle Invoice Status');
        setInvoices(prev => prev.map(inv => {
          if (inv.id === id) {
            const next = inv.status === 'paid' ? 'pending' : 'paid';
            return { ...inv, status: next };
          }
          return inv;
        }));
      };

      const deleteInvoice = (id) => {
        pushHistorySnapshot('Delete Invoice');
        setInvoices(prev => prev.filter(inv => inv.id !== id));
        showToast('Receivable Removed', 'Invoice entry deleted from cash ledger.');
      };

      const deleteExpense = (id) => {
        pushHistorySnapshot('Delete Expense');
        setExpenses(prev => prev.filter(exp => exp.id !== id));
        showToast('Payable Removed', 'Expense item deleted from cash ledger.');
      };

      const handleSaveCustomRow = (e) => {
        e.preventDefault();
        if (!newRowData.title || !newRowData.amount) return;

        pushHistorySnapshot(`Added ${isAddModalOpen}`);
        const amt = parseFloat(newRowData.amount);
        const day = parseInt(newRowData.day, 10) || 15;

        if (isAddModalOpen === 'invoice') {
          const newInv = {
            id: `custom-inv-${Date.now()}`,
            client: newRowData.title,
            amount: amt,
            dueDate: day,
            confidence: newRowData.confidence || 'high',
            status: 'pending',
            delayDays: 0,
            contactName: newRowData.title.split(' ')[0] || 'Client',
            email: 'billing@client.com'
          };
          setInvoices(prev => [...prev, newInv]);
          showToast('Receivable Added', `${newInv.client} scheduled for Day ${newInv.dueDate}.`);
        } else {
          const newExp = {
            id: `custom-exp-${Date.now()}`,
            title: newRowData.title,
            amount: amt,
            dueDayOfInterval: [day],
            category: newRowData.category || 'Vendor',
            essential: newRowData.essential,
            delayedDays: 0
          };
          setExpenses(prev => [...prev, newExp]);
          showToast('Payable Scheduled', `${newExp.title} scheduled for Day ${day}.`);
        }

        setIsAddModalOpen(null);
      };

      const handleNaturalLanguageSimulation = (e) => {
        e.preventDefault();
        if (!nlpPrompt.trim()) return;

        const query = nlpPrompt.toLowerCase();
        const rulesApplied = [];

        if (query.includes('hire') || query.includes('recruit') || query.includes('engineer') || query.includes('developer')) {
          const countMatch = query.match(/(\d+)\s*(hire|engineers|people|devs|members)/);
          const salaryMatch = query.match(/(₹|rs|rs\.|inr|\$|usd)?\s*(\d{1,7})\s*(k|l|lac|lakh|\/mo|each|salary)?/);

          const count = countMatch ? parseInt(countMatch[1], 10) : 1;
          let salary = 35000;
          if (salaryMatch) {
            let num = parseInt(salaryMatch[2], 10);
            if ((query.includes('l') || query.includes('lac') || query.includes('lakh')) && num < 100) num *= 100000;
            else if (query.includes('k') && num < 1000) num *= 1000;
            salary = num > 100 ? num : 35000;
          }
          setSimNewHireSalary(salary);
          setSimHireHeadcount(count);
          rulesApplied.push(`Adding ${count} hire(s) at ${formatCurrency(salary)}/mo`);
        }

        if (query.includes('late') || query.includes('delay') || query.includes('pays in') || query.includes('pays 20 days')) {
          const daysMatch = query.match(/(\d+)\s*(day|days|d|weeks)/);
          let days = 20;
          if (daysMatch) {
            days = parseInt(daysMatch[1], 10);
            if (query.includes('week')) days *= 7;
          }
          setSimClientDelay(days);
          rulesApplied.push(`Delaying client receivable by ${days} days`);
        }

        if (query.includes('revenue drops') || query.includes('sales down') || query.includes('drop by') || query.includes('%')) {
          const pctMatch = query.match(/(\d+)\s*%/);
          const pct = pctMatch ? parseInt(pctMatch[1], 10) : 25;
          setSimRevenueShock(pct);
          rulesApplied.push(`Simulating ${pct}% top-line revenue decline`);
        }

        if (query.includes('freeze capex') || query.includes('delay capex') || query.includes('cut non-essential')) {
          setSimCapExDelay(true);
          rulesApplied.push('Freezing non-essential CapEx & discretionary spend');
        }

        if (rulesApplied.length > 0) {
          setNlpFeedback({ query: nlpPrompt, rules: rulesApplied });
          showToast('Scenario Simulated', rulesApplied.join(' & '));
        } else {
          setNlpFeedback({
            query: nlpPrompt,
            rules: ['Simulated general liquidity stress (+14 day client slip, ₹35,000 spend)']
          });
          setSimClientDelay(14);
          setSimNewHireSalary(35000);
          setSimHireHeadcount(1);
        }
      };

      const handleFileUpload = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const text = e.target.result;
          const res = parseCSVText(text);
          if (res.success) {
            setParsedPreview(res);
          } else {
            showToast('CSV Parsing Failed', res.message);
          }
        };
        reader.readAsText(file);
      };

      const commitParsedUpload = () => {
        if (!parsedPreview) return;
        pushHistorySnapshot('Imported CSV Dataset');

        // Reset simulation sandbox so incoming data is evaluated accurately
        setSimClientDelay(0);
        setSimNewHireSalary(0);
        setSimHireHeadcount(1);
        setSimVendorDelayDays(0);
        setSimRevenueShock(0);
        setSimCapExDelay(false);
        setAppliedActions({});
        setNlpFeedback(null);
        setSelectedPresetKey('custom');

        if (importMode === 'replace') {
          // Clean replacement
          setCurrentCash(parsedPreview.detectedCash !== null ? parsedPreview.detectedCash : 10000);
          setInvoices(parsedPreview.invoices);
          setExpenses(parsedPreview.expenses);
          showToast('CSV Loaded in Real-Time', `Replaced all demo records with ${parsedPreview.invoices.length} receivables and ${parsedPreview.expenses.length} payables.`);
        } else {
          // Merge mode
          if (parsedPreview.detectedCash !== null) {
            setCurrentCash(parsedPreview.detectedCash);
          }
          setInvoices(prev => [...prev, ...parsedPreview.invoices]);
          setExpenses(prev => [...prev, ...parsedPreview.expenses]);
          showToast('CSV Merged in Real-Time', `Added ${parsedPreview.invoices.length} receivables and ${parsedPreview.expenses.length} liabilities.`);
        }

        setParsedPreview(null);
        setIsUploadModalOpen(false);
        setActiveTab('dashboard');
      };

      const handleDownloadSampleCSV = () => {
        const sample = `Type,Title,Amount,Day,Confidence,Category
balance,Opening Cash Balance,35000,1,high,Cash
receivable,Enterprise Software Contract,24000,10,high,Revenue
receivable,Design Retainer Client,8500,22,medium,Revenue
receivable,E-Commerce Wholesale Batch,14200,45,high,Revenue
payable,Monthly Engineering Payroll,22000,5,high,Payroll
payable,Quarterly GST Filing,7800,20,high,Tax
payable,Cloud Compute Infrastructure,4500,15,high,Vendor
payable,Office Lease Coworking,5200,1,high,Rent
payable,Digital Ad Retargeting,3500,28,low,Discretionary`;

        const blob = new Blob([sample], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'cashflow_template.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const handleExportCSV = () => {
        let rows = [
          ['Record Type', 'Title/Client', 'Amount', 'Scheduled Day', 'Confidence/Category', 'Status']
        ];

        rows.push(['Balance', 'Opening Cash Balance', currentCash, '1', 'Cash', 'Active']);

        invoices.forEach(inv => {
          rows.push(['Receivable', inv.client, inv.amount, inv.dueDate, inv.confidence, inv.status]);
        });

        expenses.forEach(exp => {
          rows.push(['Payable', exp.title, exp.amount, exp.dueDayOfInterval.join('|'), exp.category, exp.essential ? 'Essential' : 'Discretionary']);
        });

        const csvContent = "data:text/csv;charset=utf-8," + rows.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `cashflow_ledger_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Export Ready', 'Cash ledger downloaded as CSV.');
      };

      const crunchExplanation = useMemo(() => {
        if (!crunchDay) {
          return {
            severity: 'healthy',
            message: 'No cash deficit detected in selected projection window.',
            causes: ['Scheduled customer receipts sufficiently balance regular fixed overheads.']
          };
        }

        const windowStart = Math.max(0, crunchDay - 8);
        const heavyExpenses = [];
        expenses.forEach(e => {
          e.dueDayOfInterval.forEach(d => {
            if (d >= windowStart && d <= crunchDay + 3) {
              heavyExpenses.push({ name: e.title, amount: e.amount, day: d, category: e.category });
            }
          });
        });

        const delayedOrAtRiskInvoices = invoices.filter(inv => inv.confidence !== 'high' || (inv.dueDate >= windowStart && inv.dueDate <= crunchDay + 5));
        const mainDriverExpense = heavyExpenses.sort((a,b) => b.amount - a.amount)[0];
        const lateClient = delayedOrAtRiskInvoices[0];

        return {
          severity: 'critical',
          message: `Negative cash threshold breached around Day ${crunchDay} (Trough: ${formatCurrency(lowestExpectedCash)}).`,
          causes: [
            mainDriverExpense ? `Major committed liability: "${mainDriverExpense.name}" (${formatCurrency(mainDriverExpense.amount)}) scheduled on Day ${mainDriverExpense.day}.` : 'Concentrated payroll & statutory obligations.',
            lateClient ? `Pending receivable on "${lateClient.client}" (${formatCurrency(lateClient.amount)}) matures close to the crunch date.` : 'Receivables clearing too late.',
            'Fixed liabilities (Payroll & Taxes) take precedence before customer remittances complete clearance.'
          ]
        };
      }, [crunchDay, lowestExpectedCash, expenses, invoices]);

      const renderChart = () => {
        const width = 860;
        const height = 300;
        const padding = { top: 25, right: 35, bottom: 40, left: 65 };

        const chartW = width - padding.left - padding.right;
        const chartH = height - padding.top - padding.bottom;

        const allVals = [0];
        timelineData.forEach(d => {

        const minVal = Math.min(...allVals);
        const maxVal = Math.max(...allVals);

        const yMin = Math.min(-5000, Math.floor((minVal < 0 ? minVal * 1.2 : -5000) / 5000) * 5000);
        const yMax = Math.max(10000, Math.ceil((maxVal * 1.15) / 5000) * 5000);
        const yRange = yMax - yMin || 1;

        const getX = (day) => padding.left + (day / horizonDays) * chartW;
        const getY = (val) => padding.top + chartH - ((val - yMin) / yRange) * chartH;

        const zeroY = getY(0);

          return data.reduce((acc, curr, idx) => {
            const x = getX(curr.day);
            const y = getY(accessor(curr));
            return idx === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
          }, '');
        };

        const basePath = makePath(timelineData, d => d.base);
        const worstPath = makePath(timelineData, d => d.worst);

          const simItem = simulatedTimelineData[day] || simulatedTimelineData[0];

          setHoveredDayData({

            x: getX(day),
            baseY: getY(baseItem.base),
            simY: getY(simItem.simCash),
            baseCash: baseItem.base,
            worstCash: baseItem.worst,
            bestCash: baseItem.best,
            simCash: simItem.simCash,
            inflow: baseItem.inflow,
            outflow: baseItem.outflow

                  <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <h3 className={`font-semibold text-sm sm:text-base tracking-tight ${isDark ? 'text-slate-100' : 'text-slate-900'}`}>
                    30 / 60 / 90-Day Cash Trajectory
                  </h3>
                </div>
                <p className={`text-xs mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                  Hover or scrub across the timeline to inspect daily cash balance, expected receipts, and burn points.
                </p>
              </div>

              <div className="flex items-center gap-2">
                <div className={`flex items-center p-0.5 rounded-xl border ${
                  isDark ? 'bg-slate-950/80 border-slate-800' : 'bg-slate-100 border-slate-200'
                }`}>
                  {[30, 60, 90].map((d) => (
                    <button
                      key={d}
                      onClick={() => setHorizonDays(d)}
                      className={`px-3 py-1 rounded-lg text-xs font-semibold transition-all ${
                        horizonDays === d
                          ? 'bg-amber-400 text-slate-950 shadow-sm'

                      }`}

                      {d}d

                    }`}
                    title={`Undo last action (${historyStack[0]?.label})`}

                    <Undo2 className="w-3.5 h-3.5 text-amber-500" />

            {/* Legend */}

              <div className="flex items-center gap-1.5">
                <span className="w-3 h-0.5 rounded-full bg-emerald-500"></span>
                <span className={`text-[11px] font-medium ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>Expected Base</span>
              </div>
              <div className="flex items-center gap-1.5">
                <span className="w-3 h-0.5 rounded-full bg-emerald-300"></span>

              </div>
              {(simClientDelay > 0 || simNewHireSalary > 0 || simVendorDelayDays > 0 || simRevenueShock > 0 || simCapExDelay) && (

              >

                        x1={padding.left}

                        fontFamily="monospace"
                      >
                        {formatCurrency(val)}

                    <circle

                      y1={padding.top}
                      x2={hoveredDayData.x}
                      y2={height - padding.bottom}
                      stroke={isDark ? 'rgba(250, 204, 21, 0.6)' : 'rgba(245, 158, 11, 0.7)'}
                      strokeWidth="1"
                      strokeDasharray="2 2"
                    />
                    <circle
                      cx={hoveredDayData.x}
                      cy={hoveredDayData.baseY}
                      r="4"
                      fill="#10b981"
                      stroke="#ffffff"
                      strokeWidth="1.5"
                    />

                  </linearGradient>
                </defs>
              </svg>

              {hoveredDayData && (
                <div
                  className={`absolute top-2 pointer-events-none p-3 rounded-xl border shadow-xl text-xs z-30 transition-all ${
                    isDark ? 'bg-slate-950/95 border-slate-800 text-slate-100 backdrop-blur-md' : 'bg-white/95 border-slate-200 text-slate-900 backdrop-blur-md'
                  }`}
                  style={{
                    left: `${Math.min(Math.max(8, (hoveredDayData.x / width) * 100), 74)}%`
                  }}
                >
                  <div className="flex items-center justify-between gap-3 font-semibold pb-1.5 mb-1.5 border-b border-slate-800/40">
                    <span className="text-amber-500 font-medium">Day {hoveredDayData.day}</span>
                    <span className="font-mono font-bold text-emerald-400">{formatCurrency(hoveredDayData.baseCash)}</span>
                  </div>
                  <div className="space-y-1 text-[11px]">
                    <div className="flex justify-between gap-4">
                      <span className="text-slate-400">Worst Case:</span>
                      <span className="font-mono text-amber-500">{formatCurrency(hoveredDayData.worstCash)}</span>
                    </div>
                    {(simClientDelay > 0 || simNewHireSalary > 0) && (
                      <div className="flex justify-between gap-4 font-semibold">
                        <span className="text-amber-400">Simulated:</span>
                        <span className="font-mono text-amber-400">{formatCurrency(hoveredDayData.simCash)}</span>

                isDark ? 'bg-slate-900 border-emerald-500/40 text-white' : 'bg-white border-emerald-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-emerald-900/30">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <Plus className="w-4 h-4 text-yellow-500" />
                    {isAddModalOpen === 'invoice' ? 'Add New Receivable (Inflow)' : 'Schedule New Liability (Payable)'}
                  </h3>
                  <button onClick={() => setIsAddModalOpen(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveCustomRow} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold block mb-1">
                      {isAddModalOpen === 'invoice' ? 'Client / Entity Name' : 'Obligation / Vendor Title'}
                    </label>
                    <input
                      type="text"
                      required
                      placeholder={isAddModalOpen === 'invoice' ? 'e.g. Apex Global Corp' : 'e.g. Server Hosting Tier'}
                      value={newRowData.title}
                      onChange={(e) => setNewRowData({ ...newRowData, title: e.target.value })}
                      className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                        isDark ? 'bg-slate-950 border-emerald-900 text-white' : 'bg-slate-50 border-emerald-200 text-slate-900'
                      }`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold block mb-1">Amount (₹)</label>
                      <input
                        type="number"
                        required
                        placeholder="50000"
                        value={newRowData.amount}
                        onChange={(e) => setNewRowData({ ...newRowData, amount: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-emerald-900 text-white' : 'bg-slate-50 border-emerald-200 text-slate-900'
                        }`}
                      />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Due Day (1-90)</label>
                      <input
                        type="number"
                        min="1"
                        max="90"
                        required
                        value={newRowData.day}
                        onChange={(e) => setNewRowData({ ...newRowData, day: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-emerald-900 text-white' : 'bg-slate-50 border-emerald-200 text-slate-900'
                        }`}
                      />
                    </div>
                  </div>

                  {isAddModalOpen === 'invoice' ? (
                    <div>
                      <label className="font-semibold block mb-1">Confidence Score</label>
                      <select
                        value={newRowData.confidence}
                        onChange={(e) => setNewRowData({ ...newRowData, confidence: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-emerald-900 text-white' : 'bg-slate-50 border-emerald-200 text-slate-900'
                        }`}
                      >
                        <option value="high">High (Prompt Payer)</option>
                        <option value="medium">Medium (Standard Terms)</option>
                        <option value="low">Low (Disputed / Historically Late)</option>
                      </select>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="font-semibold block mb-1">Category</label>
                        <select
                          value={newRowData.category}
                          onChange={(e) => setNewRowData({ ...newRowData, category: e.target.value })}
                          className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                            isDark ? 'bg-slate-950 border-emerald-900 text-white' : 'bg-slate-50 border-emerald-200 text-slate-900'
                          }`}
                        >
                          <option value="Payroll">Payroll</option>
                          <option value="Tax">Tax / GST</option>
                          <option value="Rent">Rent</option>
                          <option value="Vendor">Vendor</option>
                          <option value="CapEx">CapEx / Hardware</option>
                          <option value="Discretionary">Discretionary</option>
                        </select>
                      </div>
                      <div>
                        <label className="font-semibold block mb-1">Priority</label>
                        <select
                          value={newRowData.essential ? 'true' : 'false'}
                          onChange={(e) => setNewRowData({ ...newRowData, essential: e.target.value === 'true' })}
                          className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                            isDark ? 'bg-slate-950 border-emerald-900 text-white' : 'bg-slate-50 border-emerald-200 text-slate-900'
                          }`}
                        >
                          <option value="true">Essential (Non-negotiable)</option>
                          <option value="false">Discretionary (Can Delay)</option>
                        </select>
                      </div>
                    </div>
                  )}

                  <div className="pt-3 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAddModalOpen(null)}
                      className="px-4 py-2 text-slate-400 hover:text-white"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-bold rounded-xl shadow-md"
                    >
                      Save Entry
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className={`border rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-5 transition-all ${
                isDark ? 'bg-slate-900 border-amber-500/40 text-white' : 'bg-white border-amber-300 text-slate-900'
              }`}>
                {/* Header */}
                <div className="flex items-center justify-between pb-3 border-b border-slate-800/80">
                  <div className="flex items-center gap-2.5">
                    <div className="p-2 rounded-xl bg-gradient-to-tr from-amber-400/20 to-emerald-500/20 border border-amber-400/30 text-amber-400">
                      {authMode === 'signup' ? <UserPlus className="w-5 h-5 text-amber-400" /> : <Lock className="w-5 h-5 text-amber-400" />}
                    </div>
                    <div>
                      <h3 className="font-bold text-base">
                        {authMode === 'signup' ? 'Create Business Account' : 'Company Login'}
                      </h3>
                      <p className={`text-xs ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                        {authMode === 'signup' ? 'Access your dedicated treasury & runway workspace' : 'Welcome back to CashFlow Copilot'}
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => {
                      setIsAuthModalOpen(false);
                      setAuthError('');
                    }}
                    className="text-slate-400 hover:text-white p-1 text-sm font-bold"
                  >
                    ✕
                  </button>
                </div>

                {/* Tabs */}
                <div className={`p-1 rounded-xl border flex items-center gap-1 ${
                  isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-100 border-slate-200'
                }`}>
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('login');
                      setAuthError('');
                    }}
                    className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      authMode === 'login'
                        ? 'bg-amber-400 text-slate-950 shadow-sm'
                        : isDark ? 'text-slate-400 hover:text-white' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Log In
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setAuthMode('signup');
                      setAuthError('');
                    }}
                    className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      authMode === 'signup'
                        ? 'bg-amber-400 text-slate-950 shadow-sm'
                        : isDark ? 'text-slate-400 hover:text-white' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Create Account
                  </button>
                </div>

                {/* Error Banner */}
                {authError && (
                  <div className="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-center gap-2">
                    <AlertTriangle className="w-4 h-4 shrink-0 text-rose-500" />
                    <span>{authError}</span>
                  </div>
                )}

                {/* Form */}
                <form onSubmit={handleAuthSubmit} className="space-y-3.5 text-xs">
                  {authMode === 'signup' && (
                    <div>
                      <label className="font-semibold block mb-1">Company / Enterprise Name</label>
                      <div className="relative">
                        <input
                          type="text"
                          required
                          placeholder="e.g. Nexus Technology Solutions Ltd"
                          value={authFormData.companyName}
                          onChange={(e) => setAuthFormData({ ...authFormData, companyName: e.target.value })}
                          className={`w-full pl-9 pr-3 py-2.5 rounded-xl border focus:outline-none font-semibold ${
                            isDark ? 'bg-slate-950 border-slate-800 text-white focus:border-amber-400' : 'bg-slate-50 border-slate-200 text-slate-900 focus:border-amber-500'
                          }`}
                        />
                        <Building className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="font-semibold block mb-1">Business Email Address</label>
                    <div className="relative">
                      <input
                        type="email"
                        required
                        placeholder="founder@yourcompany.com"
                        value={authFormData.email}
                        onChange={(e) => setAuthFormData({ ...authFormData, email: e.target.value })}
                        className={`w-full pl-9 pr-3 py-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800 text-white focus:border-amber-400' : 'bg-slate-50 border-slate-200 text-slate-900 focus:border-amber-500'
                        }`}
                      />
                      <Mail className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold block mb-1">Password</label>
                    <div className="relative">
                      <input
                        type="password"
                        required
                        placeholder="••••••••"
                        value={authFormData.password}
                        onChange={(e) => setAuthFormData({ ...authFormData, password: e.target.value })}
                        className={`w-full pl-9 pr-3 py-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800 text-white focus:border-amber-400' : 'bg-slate-50 border-slate-200 text-slate-900 focus:border-amber-500'
                        }`}
                      />
                      <Lock className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                    </div>
                  </div>

                  {authMode === 'signup' && (
                    <div>
                      <label className="font-semibold block mb-1">Confirm Password</label>
                      <div className="relative">
                        <input
                          type="password"
                          required
                          placeholder="••••••••"
                          value={authFormData.confirmPassword}
                          onChange={(e) => setAuthFormData({ ...authFormData, confirmPassword: e.target.value })}
                          className={`w-full pl-9 pr-3 py-2.5 rounded-xl border focus:outline-none ${
                            isDark ? 'bg-slate-950 border-slate-800 text-white focus:border-amber-400' : 'bg-slate-50 border-slate-200 text-slate-900 focus:border-amber-500'
                          }`}
                        />
                        <Lock className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                      </div>
                    </div>
                  )}

                  <div className="pt-2 space-y-2">
                    <button
                      type="submit"
                      className="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black text-xs rounded-xl shadow-md transition-all active:scale-[0.98]"
                    >
                      {authMode === 'signup' ? 'Create Company Workspace' : 'Sign In to Workspace'}
                    </button>

                    <button
                      type="button"
                      onClick={handleQuickDemoLogin}
                      className={`w-full py-2 rounded-xl text-xs font-bold border transition-all ${
                        isDark ? 'bg-slate-950/80 hover:bg-slate-800 border-slate-800 text-amber-400' : 'bg-slate-100 hover:bg-slate-200 border-slate-300 text-amber-800'
                      }`}
                    >
                      ⚡ 1-Click Demo Login (Apex Innovations)
                    </button>
                  </div>
                </form>

                <div className="text-center text-[11px] text-slate-400 pt-1 border-t border-slate-800/40">
                  {authMode === 'signup' ? (
                    <span>
                      Already have an account?{' '}
                      <button
                        type="button"
                        onClick={() => {
                          setAuthMode('login');
                          setAuthError('');
                        }}
                        className="text-amber-400 hover:underline font-bold"
                      >
                        Log in here
                      </button>
                    </span>
                  ) : (
                    <span>
                      Need a dedicated company dashboard?{' '}
                      <button
                        type="button"
                        onClick={() => {
                          setAuthMode('signup');
                          setAuthError('');
                        }}
                        className="text-amber-400 hover:underline font-bold"
                      >
                        Create an account
                      </button>
                    </span>
                  )}
                </div>
              </div>
            </div>
          )}

          {activeActionModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
              <div className={`border rounded-2xl w-full max-w-xl p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-slate-900 border-emerald-500/30' : 'bg-white border-emerald-200'
              }`}>
                <div className={`flex items-center justify-between pb-3 border-b ${
                  isDark ? 'border-emerald-900/50' : 'border-emerald-100'
                }`}>
                  <div className="flex items-center gap-2.5">
                    <div className={`p-2 rounded-xl border ${
                      isDark ? 'bg-yellow-400/10 text-yellow-400 border-yellow-400/30' : 'bg-amber-100 text-amber-800 border-amber-300'
                    }`}>
                      <Sparkles className="w-5 h-5 text-yellow-500" />
                    </div>
                    <div>
                      <h3 className={`font-bold text-base ${isDark ? 'text-white' : 'text-slate-900'}`}>
                        {activeActionModal.type === 'chase' ? 'AI Collection Reminder Draft' : 'Vendor Payment Deferral Proposal'}
                      </h3>
                      <p className={`text-xs font-medium ${isDark ? 'text-emerald-400/70' : 'text-emerald-700'}`}>
                        Crafted to accelerate liquidity while preserving relationship
                      </p>
                    </div>
                  </div>

                  <button
                    onClick={() => setActiveActionModal(null)}
                    className={`p-1 text-sm font-bold ${isDark ? 'text-slate-400 hover:text-white' : 'text-slate-500 hover:text-slate-900'}`}
                  >
                    ✕
                  </button>
                </div>

                <div className={`p-4 rounded-xl border text-xs sm:text-sm font-sans leading-relaxed whitespace-pre-line select-text ${
                  isDark ? 'bg-slate-950 border-emerald-900/40 text-slate-200' : 'bg-slate-50 border-emerald-200 text-slate-800'
                }`}>
                  {activeActionModal.type === 'chase' ? (
`Subject: Follow-up on Invoice #${activeActionModal.data?.id || 'INV-2026'} - ${formatCurrency(activeActionModal.data?.amount)}

Hi ${activeActionModal.data?.contactName || 'Finance Team'},

Hope you're having a productive week!

Our accounting records indicate Invoice #${activeActionModal.data?.id || 'INV-2026'} for ${formatCurrency(activeActionModal.data?.amount)} is scheduled for release in the upcoming pay-run.

As we conclude our month-end liquidity alignment, could you kindly confirm whether this invoice has been queued for execution?

If you require another copy of the invoice or our direct ACH/wire routing details, please let me know.

Warm regards,
Finance & Accounts Department`
                  ) : (
`Subject: Proposed 2-Tranche Schedule for ${activeActionModal.data?.title || 'Upcoming Service Billing'}

Hi Accounts Team,

We value our strong vendor collaboration and wanted to reach out proactively regarding our upcoming commitment of ${formatCurrency(activeActionModal.data?.amount)}.

To optimize working capital during our scheduled quarterly tax and payroll dates, we propose scheduling this via two installments:
- Tranche 1: 50% (${formatCurrency(Math.round((activeActionModal.data?.amount || 0) / 2))}) on Day 20
- Tranche 2: 50% (${formatCurrency(Math.round((activeActionModal.data?.amount || 0) / 2))}) on Day 45

Please confirm if this installment schedule is approved on your end.

Best regards,
Treasury Operations`
                  )}
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    onClick={() => {
                      const text = activeActionModal.type === 'chase'
                        ? `Hi ${activeActionModal.data?.contactName || 'Team'}, quick reminder regarding Invoice #${activeActionModal.data?.id || ''} for ${formatCurrency(activeActionModal.data?.amount)}. Could you confirm payment release date? Thank you!`
                        : `Hi Team, proposing a 50/50 2-part split for ${activeActionModal.data?.title || 'upcoming commitment'}. Thank you!`;
                      
                      if (navigator.clipboard) {
                        navigator.clipboard.writeText(text);
                      } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                      }
                      setCopiedText(true);
                      setTimeout(() => setCopiedText(false), 2000);
                    }}
                    className={`px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-all border ${
                      isDark
                        ? 'bg-slate-950 hover:bg-slate-800 text-yellow-400 border-yellow-400/30'
                        : 'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-300'
                    }`}
                  >
                    {copiedText ? <Check className="w-3.5 h-3.5 text-emerald-500" /> : <Copy className="w-3.5 h-3.5" />}
                    {copiedText ? 'Copied!' : 'Copy to Clipboard'}
                  </button>

                  <button
                    onClick={() => {
                      if (activeActionModal.type === 'chase') {
                        handleApplyActionExecution(
                          'accelerateAcme',
                          () => setInvoices(prev => prev.map(inv => inv.id === activeActionModal.data?.id ? { ...inv, dueDate: Math.max(2, inv.dueDate - 5), confidence: 'high' } : inv)),
                          'Invoice collection date advanced by 5 days.'
                        );
                      } else {
                        handleApplyActionExecution(
                          'splitVendor',
                          () => setExpenses(prev => prev.map(exp => exp.id === activeActionModal.data?.id ? { ...exp, amount: Math.round(exp.amount / 2), dueDayOfInterval: [20, 45] } : exp)),
                          'Vendor commitment split into two tranches.'
                        );
                      }
                      setActiveActionModal(null);
                    }}
                    className="px-4 py-2 rounded-xl bg-yellow-400 hover:bg-yellow-300 text-slate-950 text-xs font-bold flex items-center gap-1.5 shadow-md"
                  >
                    <Zap className="w-3.5 h-3.5 fill-slate-950" />
                    Apply & Recalculate Curve
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CashFlowCopilot />);
  </script>
</body>
</html>
