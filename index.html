    const formatCurrencyWithRegion = (val, region = 'IN') => {
      if (region === 'US') {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          maximumFractionDigits: 0
        }).format(val || 0);
      }
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 0
      }).format(val || 0);
    };

    const cleanNumber = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const cleaned = val.toString().replace(/[^0-9.-]+/g, '');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    };

    const parseCSVText = (text) => {
      const lines = text.trim().split(/\r\n|\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return { success: false, message: 'CSV requires a header row and at least one data row.' };

      const splitRow = (row) => {
        const matches = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
          const char = row[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            matches.push(cur.trim().replace(/^["']|["']$/g, ''));
            cur = '';
          } else {
            cur += char;
          }
        }
        matches.push(cur.trim().replace(/^["']|["']$/g, ''));
        return matches;
      };

      const headers = splitRow(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));
      const parsedInvoices = [];
      const parsedExpenses = [];
      let detectedCash = null;

      for (let i = 1; i < lines.length; i++) {
        const rawCells = splitRow(lines[i]);
        if (rawCells.length < 2 || !rawCells.some(Boolean)) continue;

        const row = {};
        headers.forEach((h, idx) => {
          row[h] = rawCells[idx] !== undefined ? rawCells[idx] : '';
        });

        const title = row.title || row.name || row.description || row.desc || row.client || row.particulars || row.vendor || `Item #${i}`;

        let day = 15;
        const rawDate = row.day || row.duedate || row.date || row.transactiondate || '';
        if (rawDate) {
          const numDay = parseInt(rawDate, 10);
          if (!isNaN(numDay) && numDay >= 1 && numDay <= 90 && !rawDate.includes('/') && !rawDate.includes('-')) {
            day = numDay;
          } else {
            const parsed = new Date(rawDate);
            if (!isNaN(parsed.getTime())) {
              const diffDays = Math.ceil((parsed - new Date()) / (1000 * 60 * 60 * 24));
              day = Math.min(Math.max(1, diffDays > 0 ? diffDays : Math.abs(diffDays % 90) + 1), 90);
            }
          }
        }

        const lowerTitle = title.toLowerCase();
        const rawType = (row.type || row.category || '').toLowerCase();
        if (rawType.includes('balance') || lowerTitle.includes('opening cash') || lowerTitle.includes('starting cash') || lowerTitle.includes('initial cash')) {
          detectedCash = cleanNumber(row.amount || row.balance || row.value || 0);
          continue;
        }

        const creditAmt = cleanNumber(row.credit || row.deposit || row.inflow || 0);
        const debitAmt = cleanNumber(row.debit || row.withdrawal || row.outflow || 0);
        const genericAmt = cleanNumber(row.amount || row.value || row.total || 0);

        let isIncome = false;
        let finalAmount = 0;

        if (creditAmt > 0) {
          isIncome = true;
          finalAmount = creditAmt;
        } else if (debitAmt > 0) {
          isIncome = false;
          finalAmount = debitAmt;
        } else {
          finalAmount = Math.abs(genericAmt);
          if (genericAmt > 0) {
            isIncome = rawType.includes('income') || rawType.includes('invoice') || rawType.includes('receivable') || rawType.includes('revenue') || rawType.includes('sale') || lowerTitle.includes('client');
          } else if (genericAmt < 0) {
            isIncome = false;
          } else {
            isIncome = rawType.includes('income') || rawType.includes('invoice') || rawType.includes('receivable');
          }
        }

        if (finalAmount <= 0) continue;

        if (isIncome) {
          parsedInvoices.push({
            id: `csv-inv-${Date.now()}-${i}`,
            client: title,
            amount: finalAmount,
            dueDate: day,
            confidence: (row.confidence || 'high').toLowerCase(),
            status: 'pending',
            delayDays: 0,
            contactName: title.split(' ')[0] || 'Client',
            email: row.email || 'billing@partner.com'
          });
        } else {
          parsedExpenses.push({
            id: `csv-exp-${Date.now()}-${i}`,
            title: title,
            amount: finalAmount,
            dueDayOfInterval: [day],
            category: row.category || (lowerTitle.includes('salary') || lowerTitle.includes('payroll') ? 'Payroll' : lowerTitle.includes('tax') || lowerTitle.includes('gst') ? 'Tax' : lowerTitle.includes('rent') ? 'Rent' : 'Vendor'),
            essential: !['marketing', 'discretionary', 'capex', 'office perks', 'party'].some(k => (row.category || '').toLowerCase().includes(k) || lowerTitle.includes(k)),
            delayedDays: 0
          });
        }
      }

      return {
        success: true,
        detectedCash,
        invoices: parsedInvoices,
        expenses: parsedExpenses,
        totalRows: parsedInvoices.length + parsedExpenses.length
      };
    };

      const {

        const days = horizonDays;
        const baseCurve = [];
        const simCurve = [];

        let baseBalance = currentCash;
        let worstBalance = currentCash;
        let bestBalance = currentCash;
        let simBalance = currentCash;

        let firstCrunch = null;
        let firstSimCrunch = null;
        let minBase = currentCash;
        let minSim = currentCash;

        for (let day = 0; day <= days; day++) {
          let dayInflowBase = 0;
          let dayInflowWorst = 0;
          let dayInflowBest = 0;
          let dayOutflow = 0;

          invoices.forEach(inv => {
            if (inv.status === 'paid') return;
            const effectiveDue = inv.dueDate + (inv.delayDays || 0);
            if (effectiveDue === day) {
              dayInflowBase += inv.amount;
              dayInflowBest += inv.amount * 1.05;
              const riskMultiplier = inv.confidence === 'high' ? 0.95 : inv.confidence === 'medium' ? 0.65 : 0.35;
              dayInflowWorst += inv.amount * riskMultiplier;
            }
          });

          expenses.forEach(exp => {
            const effectiveDueDays = exp.dueDayOfInterval.map(d => d + (exp.delayedDays || 0));
            if (effectiveDueDays.includes(day)) {
              dayOutflow += exp.amount;
            }
          });

          if (day > 0) {
            baseBalance = baseBalance + dayInflowBase - dayOutflow;
            worstBalance = worstBalance + dayInflowWorst - (dayOutflow * 1.05);
            bestBalance = bestBalance + dayInflowBest - dayOutflow;
          }

          if (baseBalance < minBase) minBase = baseBalance;
          if (baseBalance < 0 && firstCrunch === null) {
            firstCrunch = day;
          }

          baseCurve.push({
            day,
            base: Math.round(baseBalance),
            worst: Math.round(worstBalance),
            best: Math.round(bestBalance),
            inflow: dayInflowBase,
            outflow: dayOutflow
          });

          // Simulation curve
          let simDayInflow = 0;
          let simDayOutflow = 0;

          invoices.forEach(inv => {
            if (inv.status === 'paid') return;
            let effectiveDue = inv.dueDate + (inv.delayDays || 0);
            if (inv.id === simSelectedClient && simClientDelay > 0) {
              effectiveDue += simClientDelay;
            }
            if (effectiveDue === day) {
              simDayInflow += inv.amount * (1 - (simRevenueShock / 100));
            }
          });

          expenses.forEach(exp => {
            if (simCapExDelay && !exp.essential) return;
            let dueList = [...exp.dueDayOfInterval];
            if (exp.category === 'Vendor' && simVendorDelayDays > 0) {
              dueList = dueList.map(d => d + simVendorDelayDays);
            }
            const effectiveDueDays = dueList.map(d => d + (exp.delayedDays || 0));
            if (effectiveDueDays.includes(day)) {
              simDayOutflow += exp.amount;
            }
          });

          if (simNewHireSalary > 0) {
            const recurringDates = [15, 45, 75].filter(d => d <= days);
            if (recurringDates.includes(day)) {
              simDayOutflow += (simNewHireSalary * (simHireHeadcount || 1));
            }
          }

          if (day > 0) {
            simBalance = simBalance + simDayInflow - simDayOutflow;
          }

          if (simBalance < minSim) minSim = simBalance;
          if (simBalance < 0 && firstSimCrunch === null) {
            firstSimCrunch = day;
          }

          simCurve.push({
            day,
            simCash: Math.round(simBalance),
            simInflow: simDayInflow,
            simOutflow: simDayOutflow
          });
        }

        return {
          timelineData: baseCurve,
          simulatedTimelineData: simCurve,
          lowestExpectedCash: minBase,
          crunchDay: firstCrunch,
          simulatedLowestCash: minSim,
          simulatedCrunchDay: firstSimCrunch
        };
      }, [
        currentCash,
        invoices,
        expenses,
        horizonDays,
        simClientDelay,
        simSelectedClient,
        simNewHireSalary,
        simHireHeadcount,
        simVendorDelayDays,
        simRevenueShock,
        simCapExDelay
      ]);

      const totalUpcomingInflow = useMemo(() => {
        return invoices
          .filter(i => i.status !== 'paid' && (i.dueDate + (i.delayDays || 0)) <= horizonDays)
          .reduce((acc, curr) => acc + curr.amount, 0);
      }, [invoices, horizonDays]);

      const totalUpcomingOutflow = useMemo(() => {
        let sum = 0;
        expenses.forEach(exp => {
          const occurrences = exp.dueDayOfInterval.filter(d => (d + (exp.delayedDays || 0)) <= horizonDays).length;
          sum += exp.amount * occurrences;
        });
        return sum;

      const projectedRunwayDays = useMemo(() => {
        if (crunchDay) return crunchDay;
        const lastDayBalance = timelineData[timelineData.length - 1]?.base;
        if (lastDayBalance < 0) {
          const idx = timelineData.findIndex(d => d.base < 0);
          return idx !== -1 ? idx : `> ${horizonDays}`;

        return `> ${horizonDays}`;

      const activeNegotiationExpense = useMemo(() => {

      const negotiationCalculations = useMemo(() => {
        const exp = activeNegotiationExpense;
        const originalAmt = exp.amount;
        const originalPrimaryDay = exp.dueDayOfInterval[0] || 15;
        const isCrunchWindow = crunchDay && Math.abs(originalPrimaryDay - crunchDay) <= 10;

        let proposedNewOutflows = [];
        let cashSavedDuringCrunch = 0;

        if (counterOfferMode) {
          const upfront = Math.round(originalAmt * (counterOfferUpfrontPct / 100));
          const remainder = originalAmt - upfront;
          proposedNewOutflows = [
            { day: originalPrimaryDay, amount: upfront, label: `Immediate Counter Base (${counterOfferUpfrontPct}%)` },
            { day: originalPrimaryDay + 30, amount: remainder, label: `Deferred Counter Balance (${100 - counterOfferUpfrontPct}%)` }
          ];
          cashSavedDuringCrunch = isCrunchWindow ? (originalAmt - upfront) : Math.round(originalAmt * 0.5);
        } else if (negotiationStrategy === 'split_tranches') {
          if (negoTranchesCount === 2) {
            const p1 = Math.round(originalAmt * 0.5);
            const p2 = originalAmt - p1;
            proposedNewOutflows = [
              { day: originalPrimaryDay, amount: p1, label: 'Tranche 1 (50%)' },
              { day: originalPrimaryDay + 25, amount: p2, label: 'Tranche 2 (50%)' }
            ];
            cashSavedDuringCrunch = isCrunchWindow ? p2 : originalAmt * 0.5;
          } else {
            const p1 = Math.round(originalAmt * (negoUpfrontPct / 100));
            const rem = originalAmt - p1;
            const p2 = Math.round(rem / 2);
            const p3 = rem - p2;
            proposedNewOutflows = [
              { day: originalPrimaryDay, amount: p1, label: `Tranche 1 (${negoUpfrontPct}%)` },
              { day: originalPrimaryDay + 20, amount: p2, label: 'Tranche 2' },
              { day: originalPrimaryDay + 45, amount: p3, label: 'Tranche 3' }
            ];
            cashSavedDuringCrunch = isCrunchWindow ? (originalAmt - p1) : Math.round(originalAmt * 0.65);
          }
        } else if (negotiationStrategy === 'grace_extension') {
          proposedNewOutflows = [
            { day: originalPrimaryDay + negoExtensionDays, amount: originalAmt, label: `Deferred Net-${negoExtensionDays}` }
          ];
          cashSavedDuringCrunch = originalAmt;
        } else if (negotiationStrategy === 'partial_advance') {
          const upfront = Math.round(originalAmt * 0.25);
          const balloon = originalAmt - upfront;
          proposedNewOutflows = [
            { day: originalPrimaryDay, amount: upfront, label: 'Good Faith Advance (25%)' },
            { day: originalPrimaryDay + 35, amount: balloon, label: 'Settlement Balloon (75%)' }
          ];
          cashSavedDuringCrunch = balloon;
        } else {
          const reduced = Math.round(originalAmt * 0.6);
          proposedNewOutflows = [
            { day: originalPrimaryDay, amount: reduced, label: 'Optimized Downgrade (-40%)' }
          ];
          cashSavedDuringCrunch = originalAmt - reduced;
        }

        const projectedMinCash = lowestExpectedCash + cashSavedDuringCrunch;
        const runwayExtensionDaysEstimate = lowestExpectedCash < 0 && projectedMinCash >= 0
          ? 18
          : (lowestExpectedCash < 0 ? Math.min(25, Math.round(cashSavedDuringCrunch / 600)) : 7);

        return {
          proposedNewOutflows,
          cashSavedDuringCrunch,
          projectedMinCash,
          runwayExtensionDaysEstimate
        };
      }, [
        activeNegotiationExpense,
        negotiationStrategy,
        negoTranchesCount,

      const handleNaturalLanguageSimulation = (e) => {
        e.preventDefault();
        if (!nlpPrompt.trim()) return;

        const query = nlpPrompt.toLowerCase();
        const rulesApplied = [];

        if (query.includes('hire') || query.includes('recruit') || query.includes('engineer') || query.includes('developer')) {
          const countMatch = query.match(/(\d+)\s*(hire|engineers|people|devs|members)/);
          const salaryMatch = query.match(/(₹|rs|rs\.|inr|\$|usd)?\s*(\d{1,7})\s*(k|l|lac|lakh|\/mo|each|salary)?/);

          const count = countMatch ? parseInt(countMatch[1], 10) : 1;
          let salary = 35000;
          if (salaryMatch) {
            let num = parseInt(salaryMatch[2], 10);
            if ((query.includes('l') || query.includes('lac') || query.includes('lakh')) && num < 100) num *= 100000;
            else if (query.includes('k') && num < 1000) num *= 1000;
            salary = num > 100 ? num : 35000;
          }
          setSimNewHireSalary(salary);
          setSimHireHeadcount(count);
          rulesApplied.push(`Adding ${count} hire(s) at ${formatCurrency(salary)}/mo`);
        }

        if (query.includes('late') || query.includes('delay') || query.includes('pays in') || query.includes('pays 20 days')) {
          const daysMatch = query.match(/(\d+)\s*(day|days|d|weeks)/);
          let days = 20;
          if (daysMatch) {
            days = parseInt(daysMatch[1], 10);
            if (query.includes('week')) days *= 7;
          }
          setSimClientDelay(days);
          rulesApplied.push(`Delaying client receivable by ${days} days`);
        }

        if (query.includes('revenue drops') || query.includes('sales down') || query.includes('drop by') || query.includes('%')) {
          const pctMatch = query.match(/(\d+)\s*%/);
          const pct = pctMatch ? parseInt(pctMatch[1], 10) : 25;
          setSimRevenueShock(pct);
          rulesApplied.push(`Simulating ${pct}% top-line revenue decline`);
        }

        if (query.includes('freeze capex') || query.includes('delay capex')) {
          setSimCapExDelay(true);
          rulesApplied.push('Freezing non-essential CapEx');

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `cashflow_ledger_${new Date().toISOString().slice(0, 10)}.csv`);

      const handleAuthSubmit = (e) => {
        e.preventDefault();
        setAuthError('');

        const email = authFormData.email.trim().toLowerCase();
        const password = authFormData.password.trim();

        if (!email || !password) {
          setAuthError('Email and Password are required.');
          return;
        }

        if (currentUser?.id) {
          setUserWorkspaces(prev => ({
            ...prev,
            [currentUser.id]: {
              currentCash,
              invoices: JSON.parse(JSON.stringify(invoices)),
              expenses: JSON.parse(JSON.stringify(expenses))
            }
          }));
        }

        if (authMode === 'signup') {
          const companyName = authFormData.companyName.trim();
          if (!companyName) {
            setAuthError('Company Name is required.');
            return;
          }
          if (password.length < 6) {
            setAuthError('Password must be at least 6 characters long.');
            return;
          }
          if (authFormData.password !== authFormData.confirmPassword) {
            setAuthError('Passwords do not match.');
            return;
          }

          const existing = registeredUsers.find(u => u.email === email);
          if (existing) {
            setAuthError('An account with this business email already exists.');
            return;
          }

          const newUserId = `usr-${Date.now()}`;
          const newUser = {
            id: newUserId,
            companyName,
            email,
            password,
            role: 'Founder & Administrator'
          };

          const freshData = {
            currentCash: 0,
            invoices: [],
            expenses: []
          };

          setUserWorkspaces(prev => ({
            ...prev,
            [newUserId]: freshData
          }));

          setRegisteredUsers(prev => [...prev, newUser]);
          setCurrentUser(newUser);

          setCurrentCash(0);
          setInvoices([]);
          setExpenses([]);
          setSelectedPresetKey('empty');
          resetSimulationSandboxes();

          setIsAuthModalOpen(false);
          setAuthFormData({ companyName: '', email: '', password: '', confirmPassword: '' });
          showToast('New Account Created!', `Workspace refreshed to 0 for ${companyName}.`);
        } else {
          const matchedUser = registeredUsers.find(u => u.email === email && u.password === password);
          if (!matchedUser) {
            setAuthError('Invalid email or password.');
            return;
          }

          setCurrentUser(matchedUser);

          const savedData = userWorkspaces[matchedUser.id] || { currentCash: 0, invoices: [], expenses: [] };
          setCurrentCash(savedData.currentCash);
          setInvoices(JSON.parse(JSON.stringify(savedData.invoices)));
          setExpenses(JSON.parse(JSON.stringify(savedData.expenses)));
          setSelectedPresetKey(savedData.currentCash === 0 && savedData.invoices.length === 0 ? 'empty' : 'custom');

          setIsAuthModalOpen(false);
          setAuthFormData({ companyName: '', email: '', password: '', confirmPassword: '' });
          showToast('Logged In Successfully', `Workspace loaded for ${matchedUser.companyName}!`);

      const crunchExplanation = useMemo(() => {
        if (!crunchDay) {

            severity: 'healthy',
            message: 'No cash deficit detected in projection window.',

        const windowStart = Math.max(0, crunchDay - 8);
        const heavyExpenses = [];
        expenses.forEach(e => {
          e.dueDayOfInterval.forEach(d => {
            if (d >= windowStart && d <= crunchDay + 3) {
              heavyExpenses.push({ name: e.title, amount: e.amount, day: d, category: e.category });

        });

        const mainDriver = heavyExpenses.sort((a,b) => b.amount - a.amount)[0];

        return {
          severity: 'critical',
          message: `Deficit expected around Day ${crunchDay} (Trough: ${formatCurrency(lowestExpectedCash)}).`,
          causes: [
            mainDriver ? `Major commitment: "${mainDriver.name}" (${formatCurrency(mainDriver.amount)}) on Day ${mainDriver.day}.` : 'Concentrated fixed liabilities.',
            'Fixed obligations (Payroll & Tax) fall due prior to receivable clearance.'

      const renderChart = () => {
        const width = 860;
        const height = 300;
        const padding = { top: 25, right: 35, bottom: 40, left: 65 };

        const chartW = width - padding.left - padding.right;
        const chartH = height - padding.top - padding.bottom;

        const allVals = [0];
        timelineData.forEach(d => allVals.push(d.base, d.worst, d.best));
        simulatedTimelineData.forEach(d => allVals.push(d.simCash));

        const minVal = Math.min(...allVals);
        const maxVal = Math.max(...allVals);

        const yMin = Math.min(-5000, Math.floor((minVal < 0 ? minVal * 1.2 : -5000) / 5000) * 5000);
        const yMax = Math.max(10000, Math.ceil((maxVal * 1.15) / 5000) * 5000);
        const yRange = yMax - yMin || 1;

        const getX = (day) => padding.left + (day / horizonDays) * chartW;
        const getY = (val) => padding.top + chartH - ((val - yMin) / yRange) * chartH;
        const zeroY = getY(0);

        const makePath = (data, accessor) => {
          return data.reduce((acc, curr, idx) => {
            const x = getX(curr.day);
            const y = getY(accessor(curr));
            return idx === 0 ? `M ${x} ${y}` : `${acc} L ${x} ${y}`;
          }, '');
        };

        const worstPath = makePath(timelineData, d => d.worst);

          const simItem = simulatedTimelineData[day] || simulatedTimelineData[0];

          setHoveredDayData({
            day,
            x: getX(day),
            baseY: getY(baseItem.base),
            simY: getY(simItem.simCash),
            baseCash: baseItem.base,
            worstCash: baseItem.worst,
            bestCash: baseItem.best,

            inflow: baseItem.inflow,

            {/* Chart Canvas */}
            <div className="relative w-full overflow-hidden">
              <svg

                className="w-full h-auto select-none cursor-crosshair"
                onMouseMove={handleSvgMouseMove}
                onMouseLeave={() => setHoveredDayData(null)}
              >
                {[0, 0.25, 0.5, 0.75, 1].map((pct, i) => {
                  const val = yMin + pct * yRange;
                  const y = getY(val);
                  return (
                    <g key={i}>
                      <line
                        x1={padding.left}
                        y1={y}
                        x2={width - padding.right}
                        y2={y}
                        stroke={isDark ? 'rgba(51, 65, 85, 0.35)' : 'rgba(226, 232, 240, 0.8)'}

                      <text

                )}

                {isProcessingBill && (
                  <div className="p-3 rounded-xl border border-amber-500/30 bg-amber-500/10 flex items-center gap-3 text-xs text-amber-400 animate-pulse">
                    <RefreshCw className="w-4 h-4 animate-spin shrink-0" />
                    <span>Gemini AI is analyzing document details, totals, and maturity dates...</span>
                  </div>
                )}

                {parsedBillResult && (
                  <div className={`p-3.5 rounded-xl border text-xs space-y-2.5 ${
                    isDark ? 'bg-slate-950 border-emerald-500/40 text-slate-200' : 'bg-emerald-50 border-emerald-200 text-slate-800'
                  }`}>
                    <div className="flex justify-between items-center font-bold pb-1.5 border-b border-emerald-500/20">
                      <div className="flex items-center gap-1.5">
                        <CheckCircle className="w-4 h-4 text-emerald-400" />
                        <span className="text-emerald-400">Verified Bill Extraction</span>
                      </div>
                      <span className="font-mono text-emerald-400 text-sm font-bold">{formatCurrency(parsedBillResult.amount)}</span>
                    </div>

                    <div className="grid grid-cols-2 gap-2 text-slate-300">
                      <div><span className="text-slate-400">Title: </span><strong>{parsedBillResult.title}</strong></div>
                      <div><span className="text-slate-400">Due Day: </span><strong>Day {parsedBillResult.day}</strong></div>
                      <div><span className="text-slate-400">Category: </span><strong>{parsedBillResult.category}</strong></div>
                      <div><span className="text-slate-400">Type: </span><strong className="capitalize">{parsedBillResult.type}</strong></div>
                    </div>

                    <button
                      onClick={handleCommitScannedBill}
                      className="w-full mt-2 py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition-all"
                    >
                      <Zap className="w-3.5 h-3.5 fill-slate-950" />
                      <span>Add to Live Forecast & Ledger</span>
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {isUploadModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className={`border rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-slate-900 border-emerald-500/40 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <FileSpreadsheet className="w-5 h-5 text-amber-400" />
                    <h3 className="font-bold text-base">Import CSV Statement or Ledger</h3>
                  </div>
                  <button onClick={() => setIsUploadModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {!parsedPreview ? (
                  <div
                    onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
                    onDragLeave={() => setDragOver(false)}
                    onDrop={(e) => {
                      e.preventDefault();
                      setDragOver(false);
                      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                        handleFileUpload(e.dataTransfer.files[0]);
                      }
                    }}
                    onClick={() => fileInputRef.current?.click()}
                    className={`border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-all ${
                      dragOver ? 'border-amber-400 bg-amber-400/10' : isDark ? 'border-slate-800 bg-slate-950/60 hover:border-amber-400' : 'border-slate-300 bg-slate-50 hover:border-amber-400'
                    }`}
                  >
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".csv,.txt"
                      className="hidden"
                      onChange={(e) => {
                        if (e.target.files && e.target.files[0]) {
                          handleFileUpload(e.target.files[0]);
                        }
                      }}
                    />
                    <UploadCloud className="w-8 h-8 text-amber-400 mx-auto mb-2" />
                    <p className="font-bold text-sm">Drop bank CSV here or click to browse</p>
                    <p className="text-xs text-slate-400 mt-1">Accepts credit/debit statements and receivables/payables</p>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    <div className={`p-3.5 rounded-xl border space-y-1 ${
                      isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'
                    }`}>
                      <p className="font-bold text-emerald-400">CSV File Verified</p>
                      <p>Found <strong>{parsedPreview.invoices.length}</strong> customer receivables.</p>
                      <p>Found <strong>{parsedPreview.expenses.length}</strong> scheduled payables.</p>
                      {parsedPreview.detectedCash !== null && (
                        <p>Opening Cash: <strong>{formatCurrency(parsedPreview.detectedCash)}</strong></p>
                      )}
                    </div>

                    <div className="space-y-1">
                      <label className="font-semibold text-slate-400">Import Mode:</label>
                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => setImportMode('replace')}
                          className={`flex-1 p-2 rounded-lg border font-bold ${
                            importMode === 'replace' ? 'bg-amber-400 text-slate-950 border-amber-400' : isDark ? 'bg-slate-950 text-slate-400 border-slate-800' : 'bg-slate-50 text-slate-700 border-slate-200'
                          }`}
                        >
                          Replace (Clean Start)
                        </button>
                        <button
                          type="button"
                          onClick={() => setImportMode('merge')}
                          className={`flex-1 p-2 rounded-lg border font-bold ${
                            importMode === 'merge' ? 'bg-amber-400 text-slate-950 border-amber-400' : isDark ? 'bg-slate-950 text-slate-400 border-slate-800' : 'bg-slate-50 text-slate-700 border-slate-200'
                          }`}
                        >
                          Merge with Current
                        </button>
                      </div>
                    </div>

                    <div className="pt-2 flex justify-end gap-2">
                      <button onClick={() => setParsedPreview(null)} className="px-3 py-1.5 text-slate-400">Back</button>
                      <button onClick={commitParsedUpload} className="px-4 py-1.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-lg shadow-sm">
                        Apply to Forecast
                      </button>
                    </div>
                  </div>
                )}

                <div className="pt-2 border-t border-slate-800/40 flex items-center justify-between text-xs">
                  <span className="text-slate-400">Need a template format?</span>
                  <button onClick={handleDownloadSampleCSV} className="text-amber-400 font-semibold hover:underline flex items-center gap-1">
                    <Download className="w-3.5 h-3.5" /> Download Template
                  </button>
                </div>
              </div>
            </div>
          )}

          {activeActionModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className={`border rounded-2xl w-full max-w-lg p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-800/80">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <FileText className="w-4 h-4 text-amber-400" />
                    {activeActionModal.type === 'chase' ? 'Invoice Debt Collection Template' : 'Vendor Deferral Proposal'}
                  </h3>
                  <button onClick={() => setActiveActionModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className={`p-3.5 rounded-xl border text-xs font-mono whitespace-pre-line leading-relaxed select-text ${
                  isDark ? 'bg-slate-950 border-slate-800 text-slate-200' : 'bg-slate-50 border-slate-200 text-slate-800'
                }`}>
                  {activeActionModal.type === 'chase' ? (
`Subject: Follow-up on Invoice #${activeActionModal.data?.id || 'INV-2026'} - ${formatCurrency(activeActionModal.data?.amount)}

Hi ${activeActionModal.data?.contactName || 'Finance Team'},

Our records show Invoice #${activeActionModal.data?.id || 'INV-2026'} for ${formatCurrency(activeActionModal.data?.amount)} is scheduled for clearance.

Could you kindly confirm payment execution status?

Warm regards,
${currentUser?.companyName || 'Finance Operations'}`
                  ) : (
`Subject: Proposed Restructured Payment Schedule for ${activeActionModal.data?.title || 'Service Billing'}

Hi Accounts Team,

We propose restructuring our ${formatCurrency(activeActionModal.data?.amount)} balance into 2 equal installments to streamline working capital:
- 50% due on Day 20
- 50% due on Day 45

Kindly confirm if this works for your team.

Best regards,
${currentUser?.companyName || 'Finance Operations'}`
                  )}
                </div>

                <div className="flex justify-end gap-2 pt-2">
                  <button
                    onClick={() => {
                      if (navigator.clipboard) {
                        navigator.clipboard.writeText(
                          activeActionModal.type === 'chase'
                            ? `Reminder for Invoice #${activeActionModal.data?.id || ''} (${formatCurrency(activeActionModal.data?.amount)})`
                            : `Proposing 50/50 split on ${activeActionModal.data?.title || 'Service'}`
                        );
                      }
                      showToast('Copied', 'Draft copied to clipboard.');
                    }}
                    className={`px-4 py-2 border rounded-xl text-xs font-semibold ${
                      isDark ? 'border-slate-700 hover:bg-slate-800' : 'border-slate-300 hover:bg-slate-50'
                    }`}
                  >
                    Copy
                  </button>
                  <button
                    onClick={() => {
                      if (activeActionModal.type === 'chase') {
                        handleApplyActionExecution(
                          'accelerateAcme',
                          () => setInvoices(prev => prev.map(inv => inv.id === activeActionModal.data?.id ? { ...inv, dueDate: Math.max(2, inv.dueDate - 5), confidence: 'high' } : inv)),
                          'Invoice collection date advanced by 5 days.'
                        );
                      } else {
                        handleApplyActionExecution(
                          'splitVendor',
                          () => setExpenses(prev => prev.map(exp => exp.id === activeActionModal.data?.id ? { ...exp, amount: Math.round(exp.amount / 2), dueDayOfInterval: [20, 45] } : exp)),
                          'Vendor commitment split into two tranches.'
                        );
                      }
                      setActiveActionModal(null);
                    }}
                    className="px-4 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl text-xs"
                  >
                    Apply & Recalculate
                  </button>
                </div>
              </div>
            </div>
          )}

          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className={`border rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <Plus className="w-4 h-4 text-amber-400" />
                    {isAddModalOpen === 'invoice' ? 'Add Receivable' : 'Schedule Liability'}
                  </h3>
                  <button onClick={() => setIsAddModalOpen(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <form onSubmit={handleSaveCustomRow} className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold block mb-1">Title / Name</label>
                    <input
                      type="text"
                      required
                      placeholder="e.g. Apex Global Corp"
                      value={newRowData.title}
                      onChange={(e) => setNewRowData({ ...newRowData, title: e.target.value })}
                      className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold block mb-1">Amount</label>
                      <input
                        type="number"
                        required
                        placeholder="50000"
                        value={newRowData.amount}
                        onChange={(e) => setNewRowData({ ...newRowData, amount: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'
                        }`}
                      />
                    </div>
                    <div>
                      <label className="font-semibold block mb-1">Due Day (1-90)</label>
                      <input
                        type="number"
                        min="1"
                        max="90"
                        required
                        value={newRowData.day}
                        onChange={(e) => setNewRowData({ ...newRowData, day: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800 text-white' : 'bg-slate-50 border-slate-200 text-slate-900'
                        }`}
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsAddModalOpen(null)} className="px-4 py-2 text-slate-400 hover:text-white">
                      Cancel
                    </button>
                    <button type="submit" className="px-5 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold rounded-xl shadow-xs">
                      Save Entry
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isAuthModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className={`border rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-slate-900 border-amber-500/40 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <div className="p-2 rounded-lg bg-amber-400 text-slate-950">
                      {authMode === 'signup' ? <UserPlus className="w-4 h-4" /> : <Lock className="w-4 h-4" />}
                    </div>
                    <div>
                      <h3 className="font-bold text-base">{authMode === 'signup' ? 'Create Business Account' : 'Company Login'}</h3>
                      <p className="text-[11px] text-slate-400">Sign in to manage company runway</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAuthModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className={`flex rounded-lg border p-0.5 text-xs font-semibold ${
                  isDark ? 'border-slate-800 bg-slate-950' : 'border-slate-200 bg-slate-100'
                }`}>
                  <button
                    onClick={() => { setAuthMode('login'); setAuthError(''); }}
                    className={`flex-1 py-1.5 rounded-md ${authMode === 'login' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}
                  >
                    Log In
                  </button>
                  <button
                    onClick={() => { setAuthMode('signup'); setAuthError(''); }}
                    className={`flex-1 py-1.5 rounded-md ${authMode === 'signup' ? 'bg-amber-400 text-slate-950' : 'text-slate-400'}`}
                  >
                    Create Account
                  </button>
                </div>

                {authError && (
                  <div className="p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">
                    {authError}
                  </div>
                )}

                <form onSubmit={handleAuthSubmit} className="space-y-3 text-xs">
                  {authMode === 'signup' && (
                    <div>
                      <label className="font-semibold block mb-1">Company / Business Name</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. Apex Innovations Pvt Ltd"
                        value={authFormData.companyName}
                        onChange={(e) => setAuthFormData({ ...authFormData, companyName: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border text-slate-100 focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200 text-slate-900'
                        }`}
                      />
                    </div>
                  )}

                  <div>
                    <label className="font-semibold block mb-1">Business Email</label>
                    <input
                      type="email"
                      required
                      placeholder="founder@company.com"
                      value={authFormData.email}
                      onChange={(e) => setAuthFormData({ ...authFormData, email: e.target.value })}
                      className={`w-full p-2.5 rounded-xl border text-slate-100 focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>

                  <div>
                    <label className="font-semibold block mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="••••••••"
                      value={authFormData.password}
                      onChange={(e) => setAuthFormData({ ...authFormData, password: e.target.value })}
                      className={`w-full p-2.5 rounded-xl border text-slate-100 focus:outline-none ${
                        isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200 text-slate-900'
                      }`}
                    />
                  </div>

                  {authMode === 'signup' && (
                    <div>
                      <label className="font-semibold block mb-1">Confirm Password</label>
                      <input
                        type="password"
                        required
                        placeholder="••••••••"
                        value={authFormData.confirmPassword}
                        onChange={(e) => setAuthFormData({ ...authFormData, confirmPassword: e.target.value })}
                        className={`w-full p-2.5 rounded-xl border text-slate-100 focus:outline-none ${
                          isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200 text-slate-900'
                        }`}
                      />
                    </div>
                  )}

                  <div className="pt-2 space-y-2">
                    <button
                      type="submit"
                      className="w-full py-2.5 bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-xs rounded-xl shadow-sm"
                    >
                      {authMode === 'signup' ? 'Create Account (Reset to 0)' : 'Sign In'}
                    </button>

                    <button
                      type="button"
                      onClick={handleQuickDemoLogin}
                      className={`w-full py-2 font-semibold text-xs rounded-xl border ${
                        isDark ? 'bg-slate-950 hover:bg-slate-800 text-amber-400 border-slate-800' : 'bg-slate-100 hover:bg-slate-200 text-slate-800 border-slate-200'
                      }`}
                    >
                      ⚡ 1-Click Demo Login (Apex Innovations)
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CashFlowCopilot />);
  </script>
</body>
</html>
